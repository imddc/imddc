name: Refresh profile assets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render public language activity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/recent_languages.py
      - uses: actions/upload-artifact@v4
        with:
          name: profile-language-assets
          path: |
            assets/recent-languages.svg
            assets/recent-languages.json
